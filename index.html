<!DOCTYPE html>
<html lang="tr">
<head>

    <title>Anki Pro - 1000 Kelime</title>
    <style>
        * { box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
        body { background-color: #f2f2f7; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; margin: 0; padding: 20px; }
        .app-container { background: white; border-radius: 20px; box-shadow: 0 12px 40px rgba(0,0,0,0.1); width: 100%; max-width: 500px; padding: 24px; text-align: center; position: relative; }
        h1 { color: #1c1c1e; margin-top: 0; font-size: 24px; font-weight: 700; margin-bottom: 6px; }
        .stats { color: #8e8e93; font-size: 13px; margin-bottom: 18px; display: flex; justify-content: space-between; font-weight: 600; }
        
        .card { background: #ffffff; border: 2px solid #e5e5ea; border-radius: 16px; min-height: 320px; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 20px; cursor: pointer; transition: all 0.2s ease; position: relative; user-select: none; overflow: hidden; }
        .card:hover { border-color: #007aff; }
        .card-img { width: 100%; max-height: 160px; object-fit: cover; border-radius: 12px; margin-bottom: 12px; display: block; }
        .card-word { font-size: 28px; font-weight: 800; color: #1c1c1e; margin-bottom: 8px; }
        .card-meaning { font-size: 18px; color: #3a3a3c; margin-bottom: 8px; display: none; font-weight: 600; }
        .card-example { font-size: 13px; color: #34c759; background: #e8f8ec; padding: 8px 12px; border-radius: 8px; display: none; font-weight: 500; }
        .hint { font-size: 12px; color: #8e8e93; margin-top: 10px; }
        
        .anki-buttons { display: none; gap: 8px; margin-top: 20px; }
        .anki-btn { flex: 1; border: none; padding: 12px 6px; border-radius: 10px; color: white; font-weight: 700; font-size: 13px; cursor: pointer; transition: opacity 0.2s; }
        .anki-btn:active { opacity: 0.7; }
        .btn-again { background-color: #ff3b30; }
        .btn-hard { background-color: #ff9500; }
        .btn-good { background-color: #007aff; }
        .btn-easy { background-color: #34c759; }

        .show-answer-btn { background: #007aff; color: white; border: none; padding: 14px; border-radius: 12px; font-size: 16px; font-weight: 600; width: 100%; margin-top: 20px; cursor: pointer; }
        .tools { display: flex; gap: 8px; margin-top: 15px; justify-content: center; flex-wrap: wrap; }
        .tool-btn { background: #e5e5ea; color: #1c1c1e; border: none; padding: 8px 12px; border-radius: 8px; font-size: 12px; font-weight: 600; cursor: pointer; }
        .tool-btn-primary { background: #5856d6; color: white; }
        .tool-btn-nextday { background: #af52de; color: white; }
        .reset { background: transparent; color: #ff3b30; border: none; margin-top: 15px; font-size: 11px; cursor: pointer; text-decoration: underline; }

        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); justify-content: center; align-items: center; z-index: 100; padding: 16px; }
        .modal-content { background: white; border-radius: 20px; width: 100%; max-width: 500px; height: 80vh; max-height: 600px; display: flex; flex-direction: column; padding: 20px; text-align: left; box-sizing: border-box; overflow: hidden; }
        .modal-header { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #e5e5ea; padding-bottom: 12px; flex-shrink: 0; }
        .modal-header h2 { margin: 0; font-size: 17px; color: #1c1c1e; }
        .close-btn { background: none; border: none; font-size: 24px; cursor: pointer; color: #8e8e93; line-height: 1; }
        
        .filter-bar { display: flex; gap: 6px; padding: 12px 0; overflow-x: auto; flex-shrink: 0; width: 100%; -webkit-overflow-scrolling: touch; border-bottom: 1px solid #f2f2f7; }
        .filter-chip { border: 1px solid #e5e5ea; background: #f2f2f7; padding: 8px 12px; border-radius: 12px; font-size: 12px; font-weight: 600; cursor: pointer; white-space: nowrap; color: #1c1c1e; flex-shrink: 0; }
        .filter-chip.active { background: #007aff; color: white; border-color: #007aff; }
        
        .word-list { overflow-y: auto; flex: 1; margin-top: 8px; padding-right: 4px; min-height: 0; }
        .word-item { padding: 12px 0; border-bottom: 1px solid #f2f2f7; display: flex; justify-content: space-between; align-items: center; }
        .word-item-title { font-weight: 700; font-size: 15px; color: #1c1c1e; }
        .word-item-sub { font-size: 12px; color: #8e8e93; margin-top: 2px; }
        .badge { font-size: 10px; padding: 4px 8px; border-radius: 6px; color: white; font-weight: 700; flex-shrink: 0; }
        .badge-1 { background: #ff3b30; }
        .badge-2 { background: #ff9500; }
        .badge-3 { background: #007aff; }
        .badge-4 { background: #34c759; }
        .badge-0 { background: #8e8e93; }
    </style>
</head>
<body>

<div class="app-container">
    <h1>Anki Pro</h1>
    <div class="stats">
        <span>Bugün Kalan: <strong id="due-count" style="color:#007aff;">0 / 50</strong></span>
        <span>Öğrenilen: <strong id="mastered-count" style="color:#34c759;">0</strong></span>
    </div>

    <div class="card" id="flashcard" onclick="showAnswer()">
        <img id="card-image" class="card-img" src="" alt="Kelime Görseli" style="display:none;">
        <div class="card-word" id="word-text">Yükleniyor...</div>
        <div class="card-meaning" id="meaning-text"></div>
        <div class="card-example" id="example-text"></div>
        <div class="hint" id="hint-text">Cevabı Görmek İçin Tıkla (Space)</div>
    </div>

    <button class="show-answer-btn" id="main-show-btn" onclick="showAnswer()">Cevabı Göster (Space)</button>

    <div class="anki-buttons" id="anki-controls">
        <button class="anki-btn btn-again" onclick="processAnki(1)">Yeniden (1)<br><small>Hemen</small></button>
        <button class="anki-btn btn-hard" onclick="processAnki(2)">Zor (2)<br><small>1 gün</small></button>
        <button class="anki-btn btn-good" onclick="processAnki(3)">İyi (3)<br><small>3 gün</small></button>
        <button class="anki-btn btn-easy" onclick="processAnki(4)">Kolay (4)<br><small>7 gün</small></button>
    </div>

    <div class="tools">
        <button class="tool-btn tool-btn-primary" onclick="openListModal()">📋 Kelime Listesi & Filtreler</button>
        <button class="tool-btn tool-btn-nextday" onclick="advanceToNextDay()">⏩ Yeni Güne Geç (Şifreli)</button>
    </div>

    <button class="reset" onclick="resetSystem()">Tüm Anki Verilerini Sıfırla</button>
</div>

<!-- Kelime Listesi Paneli (Modal) -->
<div class="modal" id="list-modal">
    <div class="modal-content">
        <div class="modal-header">
            <h2>Günün Kelime Ayrıştırma Listesi</h2>
            <button class="close-btn" onclick="closeListModal()">&times;</button>
        </div>
        <div class="filter-bar">
            <button class="filter-chip active" id="filter-all" onclick="filterList('all', this)">Tümü (0)</button>
            <button class="filter-chip" id="filter-1" onclick="filterList(1, this)">🔴 Yeniden (0)</button>
            <button class="filter-chip" id="filter-2" onclick="filterList(2, this)">🟠 Zor (0)</button>
            <button class="filter-chip" id="filter-3" onclick="filterList(3, this)">🔵 İyi (0)</button>
            <button class="filter-chip" id="filter-4" onclick="filterList(4, this)">🟢 Kolay (0)</button>
            <button class="filter-chip" id="filter-0" onclick="filterList(0, this)">⚪ Bakılmadı (0)</button>
        </div>
        <div class="word-list" id="modal-word-container"></div>
    </div>
</div>

        ["all", "hepsi, bütün", "All people."], ["both", "her ikisi de", "Both of them."],
        ["either", "ya da, ikisinden biri", "Either option."], ["neither", "hiçbiri", "Neither side."],
        ["other", "diğer, başka", "Other way."], ["another", "başka bir", "Another day."],
        ["same", "aynı", "Same car."], ["different", "farklı", "Different color."],
        ["about", "hakkında, yaklaşık", "About music."], ["above", "üzerinde", "Above sea level."],
        ["below", "altında", "Below zero."], ["under", "altında", "Under table."],
        ["behind", "arkasında", "Behind door."], ["in front of", "önünde", "In front of house."],
        ["between", "arasında", "Between two cars."], ["among", "arasında (çokluk)", "Among friends."],
        ["through", "içinden, vasıtasıyla", "Through the tunnel."], ["across", "karşısında", "Across the street."],
        ["would", "-er/ar dı (istek)", "I would like tea."], ["could", "-ebilirdi", "You could do it."],
        ["should", "-meli/malı (tavsiye)", "You should sleep."], ["must", "-meli/malı (zorunluluk)", "Must stop."],
        ["might", "belki, ihtimal", "It might rain."], ["may", "olabilir, izin", "May I enter?"]
    ];

    // Eksik kalanları 1000'e tamamlamak için sıralı liste üretimi
    let currentIdx = fullWordList.length;
    vocabularyDatabase.forEach(item => {
        if (fullWordList.length < 1000) {
            fullWordList.push({
                word: item[0],
                meaning: item[1],
                example: item[2],
                imageUrl: `https://images.unsplash.com/photo-1516321318423-f06f85e504b3?w=500&q=80` // Güvenli yedek görsel
            });
        }
    });

    let ankiData = JSON.parse(localStorage.getItem('knn_anki_db_1000')) || {};
    let activeQueue = [];

    // Veri Tabanı Yükleme
    fullWordList.forEach((item, idx) => {
        const id = 'card_' + idx;
        if (!ankiData[id]) {
            ankiData[id] = {
                id: id,
                index: idx,
                word: item.word,
                meaning: item.meaning,
                example: item.example,
                imageUrl: item.imageUrl,
                interval: 0,
                repetition: 0,
                lastGrade: 0,
                ease: 2.5,
                dueDate: Date.now()
            };
        }
    });

    saveData();

    function initQueue() {
        const now = Date.now();
        // Günlük 50 limitli aktif kart havuzu oluşturma
        let dueCards = Object.values(ankiData).filter(c => c.dueDate <= now);
        
        // Asla bakılmamışlardan ilk sıralı 50 kartı alma
        if (dueCards.length === 0) {
            dueCards = Object.values(ankiData).filter(c => c.lastGrade === 0).sort((a,b) => a.index - b.index);
        }
        
        activeQueue = dueCards.slice(0, DAILY_LIMIT);
    }

    initQueue();

    let currentCard = null;
    let isFlipped = false;

    function saveData() {
        localStorage.setItem('knn_anki_db_1000', JSON.stringify(ankiData));
    }

    function getMasteredCards() {
        return Object.values(ankiData).filter(c => c.lastGrade >= 3).length;
    }

    function renderNextCard() {
        document.getElementById('due-count').textContent = `${activeQueue.length} / ${DAILY_LIMIT}`;
        document.getElementById('mastered-count').textContent = getMasteredCards();

        if (activeQueue.length === 0) {
            document.getElementById('card-image').style.display = 'none';
            document.getElementById('word-text').textContent = "🎉 Günlük Hedef Bitti!";
            document.getElementById('meaning-text').textContent = "Bugünün 50 kelimelik paketini başarıyla tamamladın.";
            document.getElementById('meaning-text').style.display = 'block';
            document.getElementById('example-text').style.display = 'none';
            document.getElementById('hint-text').textContent = "Daha fazla çalışmak istiyorsan 'Yeni Güne Geç' butonunu kullanabilirsin.";
            document.getElementById('main-show-btn').style.display = 'none';
            document.getElementById('anki-controls').style.display = 'none';
            return;
        }

        currentCard = activeQueue[0];
        isFlipped = false;

        const imgElement = document.getElementById('card-image');
        if (currentCard.imageUrl) {
            imgElement.src = currentCard.imageUrl;
            imgElement.style.display = 'block';
        } else {
            imgElement.style.display = 'none';
        }

        document.getElementById('word-text').textContent = currentCard.word;
        document.getElementById('meaning-text').textContent = currentCard.meaning;
        document.getElementById('example-text').textContent = currentCard.example ? `Örnek: ${currentCard.example}` : '';
        
        document.getElementById('meaning-text').style.display = 'none';
        document.getElementById('example-text').style.display = 'none';
        document.getElementById('hint-text').textContent = "Cevabı Görmek İçin Tıkla (Space)";
        
        document.getElementById('main-show-btn').style.display = 'block';
        document.getElementById('anki-controls').style.display = 'none';
    }

    function showAnswer() {
        if (!currentCard || isFlipped) return;
        isFlipped = true;

        document.getElementById('meaning-text').style.display = 'block';
        if (currentCard.example) document.getElementById('example-text').style.display = 'block';
        document.getElementById('hint-text').textContent = "";

        document.getElementById('main-show-btn').style.display = 'none';
        document.getElementById('anki-controls').style.display = 'flex';
    }

    function processAnki(grade) {
        if (!currentCard || !isFlipped) return;

        const ONE_DAY = 24 * 60 * 60 * 1000;
        let card = ankiData[currentCard.id];
        card.lastGrade = grade;

        if (grade === 1) {
            card.repetition = 0;
            card.interval = 0;
            card.dueDate = Date.now(); 
        } else {
            if (grade === 2) card.interval = 1;
            else if (grade === 3) card.interval = 3;
            else if (grade === 4) card.interval = 7;
            
            card.repetition += 1;
            card.dueDate = Date.now() + (card.interval * ONE_DAY);
        }

        saveData();

        activeQueue.shift();

        if (grade === 1) {
            activeQueue.push(card);
        }

        renderNextCard();
    }

    function advanceToNextDay() {
        const password = prompt("Yeni güne geçmek için şifreyi girin:");
        if (password === "1213") {
            const now = Date.now();
            Object.values(ankiData).forEach(card => {
                card.dueDate = now - 1000;
            });
            saveData();
            initQueue();
            renderNextCard();
            alert("Başarılı! Sıradaki 50 kelimelik paket aktif edildi.");
        } else if (password !== null) {
            alert("Hatalı şifre! İşlem iptal edildi.");
        }
    }

    function updateFilterCounts() {
        const counts = { all: 0, 0: 0, 1: 0, 2: 0, 3: 0, 4: 0 };
        Object.values(ankiData).forEach(item => {
            const g = item.lastGrade || 0;
            counts.all++;
            counts[g]++;
        });

        document.getElementById('filter-all').textContent = `Tümü (${counts.all})`;
        document.getElementById('filter-1').textContent = `🔴 Yeniden (${counts[1]})`;
        document.getElementById('filter-2').textContent = `🟠 Zor (${counts[2]})`;
        document.getElementById('filter-3').textContent = `🔵 İyi (${counts[3]})`;
        document.getElementById('filter-4').textContent = `🟢 Kolay (${counts[4]})`;
        document.getElementById('filter-0').textContent = `⚪ Bakılmadı (${counts[0]})`;
    }

    function openListModal() {
        document.getElementById('list-modal').style.display = 'flex';
        updateFilterCounts();
        filterList('all', document.getElementById('filter-all'));
    }

    function closeListModal() {
        document.getElementById('list-modal').style.display = 'none';
    }

    function filterList(filter, btn) {
        document.querySelectorAll('.filter-chip').forEach(b => b.classList.remove('active'));
        if (btn) btn.classList.add('active');

        const container = document.getElementById('modal-word-container');
        container.innerHTML = '';

        const labelMap = { 0: 'Bakılmadı', 1: 'Yeniden', 2: 'Zor', 3: 'İyi', 4: 'Kolay' };

        Object.values(ankiData).sort((a,b) => a.index - b.index).forEach(item => {
            const grade = item.lastGrade || 0;
            if (filter === 'all' || grade === filter) {
                const div = document.createElement('div');
                div.className = 'word-item';
                div.innerHTML = `
                    <div>
                        <div class="word-item-title">${item.index + 1}. ${item.word}</div>
                        <div class="word-item-sub">${item.meaning}</div>
                    </div>
                    <span class="badge badge-${grade}">${labelMap[grade]}</span>
                `;
                container.appendChild(div);
            }
        });
    }

    document.addEventListener('keydown', function(e) {
        if (e.code === 'Space' || e.code === 'Enter') {
            e.preventDefault();
            if (!isFlipped) showAnswer();
        } else if (isFlipped) {
            if (e.key === '1') processAnki(1);
            if (e.key === '2') processAnki(2);
            if (e.key === '3') processAnki(3);
            if (e.key === '4') processAnki(4);
        }
    });

    function resetSystem() {
        if (confirm("1000 kelimelik sistem sıfırlanacak. Emin misin?")) {
            localStorage.removeItem('knn_anki_db_1000');
            location.reload();
        }
    }

    renderNextCard();
</script>

</body>
</html>
