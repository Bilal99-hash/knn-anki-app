        .hint { font-size: 12px; color: #8e8e93; margin-top: 10px; }

        .btn-again { background-color: #ff3b30; }
        .btn-hard { background-color: #ff9500; }
        .btn-good { background-color: #007aff; }
        .btn-easy { background-color: #34c759; }

        .tools { display: flex; gap: 8px; margin-top: 15px; justify-content: center; flex-wrap: wrap; }

        .tool-btn-primary { background: #5856d6; color: white; }
        .tool-btn-nextday { background: #af52de; color: white; }
        .reset { background: transparent; color: #ff3b30; border: none; margin-top: 15px; font-size: 11px; cursor: pointer; text-decoration: underline; }

        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); justify-content: center; align-items: center; z-index: 100; padding: 16px; }

<div class="app-container">
    <h1>Anki Pro (FSRS)</h1>

        <span>Günün Kalan Kartı: <strong id="due-count" style="color:#007aff;">0</strong></span>

    </div>

    <div class="card-wrapper">
        <button class="audio-btn" id="speak-btn" onclick="speakWord(event)" title="Telaffuzu Dinle">🔊</button>
        <div class="card" id="flashcard" onclick="showAnswer()">

            <div class="card-word" id="word-text">Yükleniyor...</div>
            <div class="card-meaning" id="meaning-text"></div>
            <div class="card-example" id="example-text"></div>
            <div class="card-translation" id="translation-text"></div>
            <div class="hint" id="hint-text">Cevabı Görmek İçin Tıkla (Space)</div>
        </div>
    </div>

    <button class="show-answer-btn" id="main-show-btn" onclick="showAnswer()">Cevabı Göster (Space)</button>

    <div class="anki-buttons" id="anki-controls">
        <button class="anki-btn btn-again" onclick="processAnki(1)">Yeniden (1)</button>
        <button class="anki-btn btn-hard" onclick="processAnki(2)">Zor (2)</button>
        <button class="anki-btn btn-good" onclick="processAnki(3)">İyi (3)</button>
        <button class="anki-btn btn-easy" onclick="processAnki(4)">Kolay (Kaldır)</button>
    </div>

    <div class="tools">
        <button class="tool-btn tool-btn-primary" onclick="openListModal()">📋 Kelime Listesi & Filtreler</button>
        <button class="tool-btn tool-btn-nextday" onclick="advanceToNextDay()">⏩ Yeni Güne Geç (Şifreli)</button>
    </div>

    <button class="reset" onclick="resetSystem()">Tüm Anki Verilerini Sıfırla</button>
</div>

<div class="modal" id="list-modal">

        </div>
        <div class="filter-bar">

            <button class="filter-chip" id="filter-1" onclick="filterList(1, this)">🔴 Yeniden (0)</button>
            <button class="filter-chip" id="filter-2" onclick="filterList(2, this)">🟠 Zor (0)</button>

    </div>
</div>

        ["aim","hedeflemek","Aim for the best.","En iyisini hedefle.","🎯"],

        ["allow","izin vermek","Do not allow this.","Buna izin verme.","🟢"],
        ["almost","neredeyse","It is almost done.","Neredeyse bitti.","⏳"],
        ["alone","yalnız","He is sitting alone.","Yalnız oturuyor.","🧘‍♂️"],
        ["alphabet","alfabe","Read the alphabet.","Alfabeyi oku.","🔤"],
        ["already","zaten","I already know this.","Bunu zaten biliyorum.","✅"],
        ["alter","değiştirmek","Alter your plans.","Planlarını değiştir.","🔄"],
        ["alternative","alternatif","Find an alternative.","Bir alternatif bul.","🔀"],
        ["always","her zaman","Always keep smiling.","Her zaman gülümse.","♾️"],
        ["amaze","şaşırtmak","You amaze me every time.","Beni her seferinde şaşırtıyorsun.","😲"],
        ["ambition","hırs","She has big ambitions.","Büyük hırsları var.","🔥"],
        ["ancient","antik","An ancient temple.","Antik bir tapınak.","🏛️"],
        ["anger","öfke","Control your anger.","Öfkeni kontrol et.","😡"],
        ["angle","açı","Look from another angle.","Başka bir açıdan bak.","📐"]
    ];

    let fullWordList = [];
    baseSeeds.forEach(w => fullWordList.push({ word: w[0], meaning: w[1], example: w[2], translation: w[3], icon: w[4] }));

    let loopIndex = 0;
    while (fullWordList.length < 1000) {
        let item = extraDictionary[loopIndex % extraDictionary.length];
        let copyNum = Math.floor(loopIndex / extraDictionary.length);
        let tag = copyNum > 0 ? " (" + (copyNum + 1) + ")" : "";
        fullWordList.push({
            word: item[0] + tag,
            meaning: item[1],
            example: item[2],
            translation: item[3],
            icon: item[4]
        });
        loopIndex++;
    }

    let ankiData = JSON.parse(localStorage.getItem('knn_anki_1000_v3_db')) || {};
    let activeQueue = [];
    let repeatQueue = []; 

    fullWordList.forEach((item, idx) => {
        const id = 'card_' + idx;
        if (!ankiData[id]) {
            ankiData[id] = {
                id: id,
                index: idx,
                word: item.word,
                meaning: item.meaning,
                example: item.example,
                translation: item.translation,
                icon: item.icon,
                lastGrade: 0
            };
        }
    });

    function saveData() {
        localStorage.setItem('knn_anki_1000_v3_db', JSON.stringify(ankiData));
        localStorage.setItem('knn_1000_act_v3', JSON.stringify(activeQueue));
        localStorage.setItem('knn_1000_rep_v3', JSON.stringify(repeatQueue));
    }

    function buildDailyQueue() {
        let againCards = Object.values(ankiData).filter(c => c.lastGrade === 1);
        
        let newCards = Object.values(ankiData)
            .filter(c => c.lastGrade === 0)
            .sort((a,b) => a.index - b.index)
            .slice(0, DAILY_LIMIT);

        activeQueue = [...newCards, ...againCards];
        repeatQueue = [];
    }

    let activeSavedQueue = JSON.parse(localStorage.getItem('knn_1000_act_v3'));
    let repeatSavedQueue = JSON.parse(localStorage.getItem('knn_1000_rep_v3'));

    if (activeSavedQueue && (activeSavedQueue.length > 0 || (repeatSavedQueue && repeatSavedQueue.length > 0))) {
        activeQueue = activeSavedQueue || [];
        repeatQueue = repeatSavedQueue || [];
    } else {
        buildDailyQueue();
    }

    saveData();

    let currentCard = null;
    let isFlipped = false;

    function getMasteredCards() {
        return Object.values(ankiData).filter(c => c.lastGrade >= 2).length;
    }

    function renderNextCard() {
        let totalRemaining = activeQueue.length + repeatQueue.length;
        document.getElementById('due-count').textContent = totalRemaining;
        document.getElementById('mastered-count').textContent = getMasteredCards();

        if (activeQueue.length === 0 && repeatQueue.length > 0) {
            activeQueue = [...repeatQueue];
            repeatQueue = [];
            saveData();
        }

        if (activeQueue.length === 0) {
            document.getElementById('card-icon').style.display = 'none';
            document.getElementById('word-text').textContent = "🎉 Bugünün Paketi Bitti!";
            document.getElementById('speak-btn').style.display = 'none';
            document.getElementById('meaning-text').textContent = "Günün tüm kelimelerini tamamladın.";
            document.getElementById('meaning-text').style.display = 'block';
            document.getElementById('example-text').style.display = 'none';
            document.getElementById('translation-text').style.display = 'none';
            document.getElementById('hint-text').textContent = "Yeni 50 kelime + dünden kalanlar için 'Yeni Güne Geç' butonunu kullanabilirsin.";
            document.getElementById('main-show-btn').style.display = 'none';
            document.getElementById('anki-controls').style.display = 'none';
            return;
        }

        currentCard = activeQueue[0];
        isFlipped = false;

        document.getElementById('card-icon').textContent = currentCard.icon || '💡';
        document.getElementById('card-icon').style.display = 'none';
        document.getElementById('word-text').textContent = currentCard.word;
        document.getElementById('speak-btn').style.display = 'flex';
        document.getElementById('meaning-text').textContent = currentCard.meaning;
        document.getElementById('example-text').textContent = currentCard.example ? `Örnek: ${currentCard.example}` : '';
        document.getElementById('translation-text').textContent = currentCard.translation ? `Türkçesi: ${currentCard.translation}` : '';
        
        document.getElementById('meaning-text').style.display = 'none';
        document.getElementById('example-text').style.display = 'none';
        document.getElementById('translation-text').style.display = 'none';
        document.getElementById('hint-text').textContent = "Cevabı Görmek İçin Tıkla (Space)";
        
        document.getElementById('main-show-btn').style.display = 'block';
        document.getElementById('anki-controls').style.display = 'none';
    }

    function speakWord(event) {
        if (event) event.stopPropagation();
        if (!currentCard || !currentCard.word) return;

        if ('speechSynthesis' in window) {
            window.speechSynthesis.cancel();
            const utterance = new SpeechSynthesisUtterance(currentCard.word);
            utterance.lang = 'en-US';
            utterance.rate = 0.85;
            window.speechSynthesis.speak(utterance);
        }
    }

    function showAnswer() {
        if (!currentCard || isFlipped) return;
        isFlipped = true;

        document.getElementById('card-icon').style.display = 'block';
        document.getElementById('meaning-text').style.display = 'block';
        if (currentCard.example) document.getElementById('example-text').style.display = 'block';
        if (currentCard.translation) document.getElementById('translation-text').style.display = 'block';
        document.getElementById('hint-text').textContent = "";

        document.getElementById('main-show-btn').style.display = 'none';
        document.getElementById('anki-controls').style.display = 'flex';
    }

    function processAnki(grade) {
        if (!currentCard || !isFlipped) return;

        let card = ankiData[currentCard.id];
        card.lastGrade = grade;

        const poppedCard = activeQueue.shift();

        if (grade === 1) {
            repeatQueue.push(poppedCard);
        }

        saveData();
        renderNextCard();
    }

    function deleteCardDirectly(cardId) {
        if (confirm("Bu kelimeyi listeden kalıcı olarak silmek istediğine emin misin?")) {
            delete ankiData[cardId];
            activeQueue = activeQueue.filter(c => c.id !== cardId);
            repeatQueue = repeatQueue.filter(c => c.id !== cardId);
            saveData();
            renderNextCard();
            updateFilterCounts();
            filterList('all', document.querySelector('.filter-chip.active'));
        }
    }

    function advanceToNextDay() {
        const password = prompt("Yeni güne geçmek için şifreyi girin:");
        if (password === "1213") {
            buildDailyQueue();
            saveData();
            renderNextCard();
            alert(`Başarılı! Yeni gün yüklendi. Sırada tam ${activeQueue.length} kelime var.`);
        } else if (password !== null) {
            alert("Hatalı şifre! İşlem iptal edildi.");
        }
    }

    function updateFilterCounts() {
        const counts = { all: 0, 0: 0, 1: 0, 2: 0, 3: 0, 4: 0 };
        Object.values(ankiData).forEach(item => {
            const g = item.lastGrade || 0;
            counts.all++;
            counts[g]++;
        });

        document.getElementById('filter-all').textContent = `Tümü (${counts.all})`;
        document.getElementById('filter-1').textContent = `🔴 Yeniden (${counts[1]})`;
        document.getElementById('filter-2').textContent = `🟠 Zor (${counts[2]})`;
        document.getElementById('filter-3').textContent = `🔵 İyi (${counts[3]})`;
        document.getElementById('filter-4').textContent = `🟢 Kolay (${counts[4]})`;
        document.getElementById('filter-0').textContent = `⚪ Bakılmadı (${counts[0]})`;
    }

    function openListModal() {
        document.getElementById('list-modal').style.display = 'flex';
        updateFilterCounts();
        filterList('all', document.getElementById('filter-all'));
    }

    function closeListModal() {
        document.getElementById('list-modal').style.display = 'none';
    }

    function filterList(filter, btn) {
        document.querySelectorAll('.filter-chip').forEach(b => b.classList.remove('active'));
        if (btn) btn.classList.add('active');

        const container = document.getElementById('modal-word-container');
        container.innerHTML = '';

        const labelMap = { 0: 'Bakılmadı', 1: 'Yeniden', 2: 'Zor', 3: 'İyi', 4: 'Kolay' };

        Object.values(ankiData).sort((a,b) => a.index - b.index).forEach(item => {
            const grade = item.lastGrade || 0;
            if (filter === 'all' || grade === filter) {
                const div = document.createElement('div');
                div.className = 'word-item';
                div.innerHTML = `
                    <div class="word-item-info">
                        <div class="word-item-title">${item.index + 1}. ${item.word}</div>
                        <div class="word-item-sub">${item.meaning}</div>
                    </div>
                    <div class="word-item-actions">
                        <span class="badge badge-${grade}">${labelMap[grade]}</span>
                        <button class="delete-btn" onclick="deleteCardDirectly('${item.id}')">Sil</button>
                    </div>
                `;
                container.appendChild(div);
            }
        });
    }

    document.addEventListener('keydown', function(e) {
        if (e.code === 'Space' || e.code === 'Enter') {
            e.preventDefault();
            if (!isFlipped) showAnswer();
        } else if (isFlipped) {
            if (e.key === '1') processAnki(1);
            if (e.key === '2') processAnki(2);
            if (e.key === '3') processAnki(3);
            if (e.key === '4') processAnki(4);
        }
    });

    function resetSystem() {
        if (confirm("Tüm Anki verileri silinecek ve sıfırlanacak. Emin misin?")) {
            localStorage.clear();
            location.reload();
        }
    }

    renderNextCard();
</script>

</body>
</html>
