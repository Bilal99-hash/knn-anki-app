<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Anki Pro (FSRS-4)</title>
    <style>
        * { box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
        body { background-color: #f2f2f7; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; margin: 0; padding: 20px; }
        .app-container { background: white; border-radius: 20px; box-shadow: 0 12px 40px rgba(0,0,0,0.1); width: 100%; max-width: 500px; padding: 24px; text-align: center; position: relative; }
        h1 { color: #1c1c1e; margin-top: 0; font-size: 24px; font-weight: 700; margin-bottom: 6px; }
        .stats { color: #8e8e93; font-size: 13px; margin-bottom: 18px; display: flex; justify-content: space-between; font-weight: 600; }
        
        .card-wrapper { position: relative; width: 100%; }
        .card { background: #ffffff; border: 2px solid #e5e5ea; border-radius: 16px; min-height: 320px; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 20px; cursor: pointer; transition: all 0.2s ease; position: relative; user-select: none; overflow: hidden; }
        .card:hover { border-color: #007aff; }
        
        /* Görsel İkon Kapalıyken Gizli */
        .card-icon { font-size: 80px; margin-bottom: 12px; line-height: 1; display: none; }
        
        .audio-btn { position: absolute; top: 12px; right: 12px; background: #007aff; color: white; border: none; border-radius: 50%; width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; cursor: pointer; font-size: 20px; z-index: 99; box-shadow: 0 4px 12px rgba(0,122,255,0.4); }
        .audio-btn:active { transform: scale(0.92); }

        .card-word { font-size: 28px; font-weight: 800; color: #1c1c1e; margin-bottom: 8px; }
        .card-meaning { font-size: 18px; color: #3a3a3c; margin-bottom: 8px; display: none; font-weight: 600; }
        .card-example { font-size: 13px; color: #007aff; background: #eef7ff; padding: 8px 12px; border-radius: 8px; display: none; font-weight: 500; margin-bottom: 6px; }
        .card-translation { font-size: 13px; color: #34c759; background: #e8f8ec; padding: 8px 12px; border-radius: 8px; display: none; font-weight: 500; }
        .hint { font-size: 12px; color: #8e8e93; margin-top: 10px; }
        
        .anki-buttons { display: none; gap: 8px; margin-top: 20px; }
        .anki-btn { flex: 1; border: none; padding: 14px 6px; border-radius: 10px; color: white; font-weight: 700; font-size: 13px; cursor: pointer; transition: opacity 0.2s; }
        .anki-btn:active { opacity: 0.7; }
        .btn-again { background-color: #ff3b30; }
        .btn-hard { background-color: #ff9500; }
        .btn-good { background-color: #007aff; }
        .btn-easy { background-color: #34c759; }

        .show-answer-btn { background: #007aff; color: white; border: none; padding: 14px; border-radius: 12px; font-size: 16px; font-weight: 600; width: 100%; margin-top: 20px; cursor: pointer; }
        .tools { display: flex; gap: 8px; margin-top: 15px; justify-content: center; flex-wrap: wrap; }
        .tool-btn { background: #e5e5ea; color: #1c1c1e; border: none; padding: 8px 12px; border-radius: 8px; font-size: 12px; font-weight: 600; cursor: pointer; }
        .tool-btn-primary { background: #5856d6; color: white; }
        .tool-btn-nextday { background: #af52de; color: white; }
        .reset { background: transparent; color: #ff3b30; border: none; margin-top: 15px; font-size: 11px; cursor: pointer; text-decoration: underline; }

        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); justify-content: center; align-items: center; z-index: 100; padding: 16px; }
        .modal-content { background: white; border-radius: 20px; width: 100%; max-width: 500px; height: 80vh; max-height: 600px; display: flex; flex-direction: column; padding: 20px; text-align: left; box-sizing: border-box; overflow: hidden; }
        .modal-header { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #e5e5ea; padding-bottom: 12px; flex-shrink: 0; }
        .modal-header h2 { margin: 0; font-size: 17px; color: #1c1c1e; }
        .close-btn { background: none; border: none; font-size: 24px; cursor: pointer; color: #8e8e93; line-height: 1; }
        
        .filter-bar { display: flex; gap: 6px; padding: 12px 0; overflow-x: auto; flex-shrink: 0; width: 100%; -webkit-overflow-scrolling: touch; border-bottom: 1px solid #f2f2f7; }
        .filter-chip { border: 1px solid #e5e5ea; background: #f2f2f7; padding: 8px 12px; border-radius: 12px; font-size: 12px; font-weight: 600; cursor: pointer; white-space: nowrap; color: #1c1c1e; flex-shrink: 0; }
        .filter-chip.active { background: #007aff; color: white; border-color: #007aff; }
        
        .word-list { overflow-y: auto; flex: 1; margin-top: 8px; padding-right: 4px; min-height: 0; }
        .word-item { padding: 12px 0; border-bottom: 1px solid #f2f2f7; display: flex; justify-content: space-between; align-items: center; }
        .word-item-info { flex: 1; }
        .word-item-title { font-weight: 700; font-size: 15px; color: #1c1c1e; }
        .word-item-sub { font-size: 12px; color: #8e8e93; margin-top: 2px; }
        .word-item-actions { display: flex; align-items: center; gap: 8px; }
        .delete-btn { background: #ff3b30; color: white; border: none; border-radius: 6px; padding: 4px 8px; font-size: 11px; cursor: pointer; font-weight: 600; }
        .badge { font-size: 10px; padding: 4px 8px; border-radius: 6px; color: white; font-weight: 700; flex-shrink: 0; }
        .badge-1 { background: #ff3b30; }
        .badge-2 { background: #ff9500; }
        .badge-3 { background: #007aff; }
        .badge-4 { background: #34c759; }
        .badge-0 { background: #8e8e93; }
    </style>
</head>
<body>

<div class="app-container">
    <h1>Anki Pro (FSRS)</h1>
    <div class="stats">
        <span>Günün Kalan Kartı: <strong id="due-count" style="color:#007aff;">0</strong></span>
        <span>Öğrenilen: <strong id="mastered-count" style="color:#34c759;">0</strong></span>
    </div>

    <div class="card-wrapper">
        <button class="audio-btn" id="speak-btn" onclick="speakWord(event)" title="Telaffuzu Dinle">🔊</button>
        <div class="card" id="flashcard" onclick="showAnswer()">
            <div id="card-icon" class="card-icon">📖</div>
            <div class="card-word" id="word-text">Yükleniyor...</div>
            <div class="card-meaning" id="meaning-text"></div>
            <div class="card-example" id="example-text"></div>
            <div class="card-translation" id="translation-text"></div>
            <div class="hint" id="hint-text">Cevabı Görmek İçin Tıkla (Space)</div>
        </div>
    </div>

    <button class="show-answer-btn" id="main-show-btn" onclick="showAnswer()">Cevabı Göster (Space)</button>

    <div class="anki-buttons" id="anki-controls">
        <button class="anki-btn btn-again" onclick="processAnki(1)">Yeniden (1)</button>
        <button class="anki-btn btn-hard" onclick="processAnki(2)">Zor (2)</button>
        <button class="anki-btn btn-good" onclick="processAnki(3)">İyi (3)</button>
        <button class="anki-btn btn-easy" onclick="processAnki(4)">Kolay (Kaldır)</button>
    </div>

    <div class="tools">
        <button class="tool-btn tool-btn-primary" onclick="openListModal()">📋 Kelime Listesi & Filtreler</button>
        <button class="tool-btn tool-btn-nextday" onclick="advanceToNextDay()">⏩ Yeni Güne Geç (Şifreli)</button>
    </div>

    <button class="reset" onclick="resetSystem()">Tüm Anki Verilerini Sıfırla</button>
</div>

<div class="modal" id="list-modal">
    <div class="modal-content">
        <div class="modal-header">
            <h2>Günün Kelime Ayrıştırma Listesi</h2>
            <button class="close-btn" onclick="closeListModal()">&times;</button>
        </div>
        <div class="filter-bar">
            <button class="filter-chip active" id="filter-all" onclick="filterList('all', this)">Tümü (0)</button>
            <button class="filter-chip" id="filter-1" onclick="filterList(1, this)">🔴 Yeniden (0)</button>
            <button class="filter-chip" id="filter-2" onclick="filterList(2, this)">🟠 Zor (0)</button>
            <button class="filter-chip" id="filter-3" onclick="filterList(3, this)">🔵 İyi (0)</button>
            <button class="filter-chip" id="filter-4" onclick="filterList(4, this)">🟢 Kolay (0)</button>
            <button class="filter-chip" id="filter-0" onclick="filterList(0, this)">⚪ Bakılmadı (0)</button>
        </div>
        <div class="word-list" id="modal-word-container"></div>
    </div>
</div>

<script>
    const DAILY_LIMIT = 50;

    const baseWords = [
        ["book", "kitap", "I read a book every night.", "Her gece bir kitap okurum.", "📖"],
        ["water", "su", "I drink water every day.", "Her gün su içerim.", "💧"],
        ["house", "ev", "My house is near the park.", "Evim parkın yakınındadır.", "🏠"],
        ["car", "araba", "He drives a red car.", "O kırmızı bir araba sürer.", "🚗"],
        ["phone", "telefon", "Where is my phone?", "Telefonum nerede?", "📱"],
        ["apple", "elma", "An apple a day keeps the doctor away.", "Günde bir elma doktoru uzak tutar.", "🍎"],
        ["cat", "kedi", "The cat is sleeping on the sofa.", "Kedi kanepede uyuyor.", "🐱"],
        ["dog", "köpek", "The dog is running fast.", "Köpek hızlı koşuyor.", "🐶"],
        ["tree", "ağaç", "There is a big tree in the garden.", "Bahçede büyük bir ağaç var.", "🌳"],
        ["sun", "güneş", "The sun is shining today.", "Bugün güneş parlıyor.", "☀️"],
        ["coffee", "kahve", "I drink coffee every morning.", "Her sabah kahve içerim.", "☕"],
        ["tea", "çay", "Would you like a cup of tea?", "Bir fincan çay ister misiniz?", "🍵"],
        ["door", "kapı", "Please close the door.", "Lütfen kapıyı kapatın.", "🚪"],
        ["room", "oda", "My room is clean.", "Odam temizdir.", "🛏️"],
        ["bread", "ekmek", "I buy fresh bread.", "Taze ekmek alırım.", "🍞"],
        ["milk", "süt", "I drink a glass of milk.", "Bir bardak süt içerim.", "🥛"],
        ["chair", "sandalye", "Sit on the chair.", "Sandalyeye otur.", "🪑"],
        ["table", "masa", "The book is on the table.", "Kitap masanın üstündedir.", "🪵"],
        ["pen", "kalem", "Write with a pen.", "Kalemle yaz.", "🖊️"],
        ["bag", "çanta", "My school bag is heavy.", "Okul çantam ağırdır.", "🎒"],
        ["key", "anahtar", "Where is my key?", "Anahtarım nerede?", "🔑"],
        ["bed", "yatak", "Go to bed early.", "Erkenden yatağa git.", "🛏️"],
        ["box", "kutu", "Open the wooden box.", "Ahşap kutuyu aç.", "📦"],
        ["glass", "bardak", "A glass of water, please.", "Bir bardak su, lütfen.", "🥛"],
        ["plate", "tabak", "The plate is clean.", "Tabak temizdir.", "🍽️"],
        ["fork", "çatal", "Use a fork to eat.", "Yemek için çatal kullan.", "🍴"],
        ["spoon", "kaşık", "A spoon for the soup.", "Çorba için bir kaşık.", "🥄"],
        ["knife", "bıçak", "Be careful with the knife.", "Bıçağa dikkat et.", "🔪"],
        ["hat", "şapka", "He wears a black hat.", "O siyah bir şapka takar.", "🧢"],
        ["coat", "palto, mont", "Put on your coat.", "Paltonu giy.", "🧥"],
        ["desk", "çalışma masası", "Study at your desk.", "Çalışma masanda çalış.", "🖥️"],
        ["pencil", "kurşun kalem", "Draw with a pencil.", "Kurşun kalemle çiz.", "✏️"],
        ["map", "harita", "Look at the world map.", "Dünya haritasına bak.", "🗺️"],
        ["picture", "resim, fotoğraf", "This is a nice picture.", "Bu güzel bir resim.", "🖼️"],
        ["music", "müzik", "I love listening to music.", "Müzik dinlemeyi seviyorum.", "🎵"],
        ["game", "oyun", "Let's play a game.", "Hadi bir oyun oynayalım.", "🎮"],
        ["ball", "top", "Kick the ball.", "Topa vur.", "⚽"],
        ["baby", "bebek", "The baby is sleeping.", "Bebek uyuyor.", "👶"],
        ["doctor", "doktor", "You should see a doctor.", "Bir doktora görünmelisin.", "👨‍⚕️"],
        ["teacher", "öğretmen", "She is a good teacher.", "O iyi bir öğretmendir.", "👩‍🏫"],
        ["student", "öğrenci", "He is a hardworking student.", "O çalışkan bir öğrencidir.", "🎓"],
        ["family", "aile", "I love my family.", "Ailemi seviyorum.", "👨‍👩‍👧‍👦"],
        ["father", "baba", "My father is at work.", "Babam iştedir.", "👨"],
        ["mother", "anne", "My mother cooks well.", "Annem güzel yemek pişirir.", "👩"],
        ["city", "şehir", "Istanbul is a big city.", "İstanbul büyük bir şehirdir.", "🏙️"],
        ["school", "okul", "Children go to school.", "Çocuklar okula gider.", "🏫"],
        ["clean", "temizlemek", "Clean your room today.", "Bugün odanı temizle.", "🧹"],
        ["open", "açmak", "Open the door, please.", "Lütfen kapıyı açın.", "🔓"],
        ["close", "kapatmak", "Close the window.", "Pencereyi kapat.", "🔒"],
        ["today", "bugün", "Today is a beautiful day.", "Bugün güzel bir gün.", "📅"],
        ["tomorrow", "yarın", "See you tomorrow.", "Yarın görüşürüz.", "🌅"],
        ["yesterday", "dün", "I saw him yesterday.", "Onu dün gördüm.", "🌆"],
        ["because", "çünkü", "I stayed home because it rained.", "Evde kaldım çünkü yağmur yağdı.", "❓"],
        ["if", "eğer", "Call me if you need help.", "Yardıma ihtiyacın olursa beni ara.", "🔀"]
    ];

    let fullWordList = [];
    baseWords.forEach(w => {
        fullWordList.push({ word: w[0], meaning: w[1], example: w[2], translation: w[3], icon: w[4] });
    });

    const extraNouns = ["street", "park", "river", "mountain", "ocean", "beach", "sky", "star", "moon", "cloud", "rain", "snow", "wind", "flower", "forest", "animal", "bird", "fish", "horse", "cow", "sheep", "chicken", "market", "store", "bank", "hotel", "airport", "station", "train", "bus", "plane", "ship", "bicycle", "bridge", "road", "field", "farm", "garden", "village", "town", "country", "world", "space", "time", "year", "month", "week", "day", "night", "morning", "afternoon", "evening", "hour", "minute", "second", "friend", "neighbor", "child", "man", "woman", "person", "group", "team", "class", "job", "work", "office", "company", "money", "price", "cost", "number", "letter", "word", "sentence", "page", "paper", "computer", "screen", "keyboard", "mouse", "internet", "website", "email", "message", "voice", "sound", "light", "color", "shape", "size", "weight", "height", "speed", "power", "energy", "system", "rule", "law"];
    
    let count = fullWordList.length;
    for (let i = 0; fullWordList.length < 1000; i++) {
        let n = extraNouns[i % extraNouns.length] + "_" + (Math.floor(i / extraNouns.length) + 1);
        fullWordList.push({
            word: n,
            meaning: `anlam_${count + 1}`,
            example: `This is an example sentence for ${n}.`,
            translation: `Bu ${n} için örnek bir cümledir.`,
            icon: "💡"
        });
        count++;
    }

    let ankiData = JSON.parse(localStorage.getItem('knn_anki_clean_day_db')) || {};
    let activeQueue = [];

    fullWordList.forEach((item, idx) => {
        const id = 'card_' + idx;
        if (!ankiData[id]) {
            ankiData[id] = {
                id: id,
                index: idx,
                word: item.word,
                meaning: item.meaning,
                example: item.example,
                translation: item.translation,
                icon: item.icon,
                lastGrade: 0
            };
        }
    });

    saveData();

    // İSTEDİĞİN NET GÜN MANTIĞI:
    // Sadece henüz Bakılmamış (lastGrade === 0) YENİ 50 Kelime + Dünden Kalan "1 (Yeniden)" Kelimeleri
    function buildDailyQueue() {
        let againCards = Object.values(ankiData).filter(c => c.lastGrade === 1);
        let newCards = Object.values(ankiData)
            .filter(c => c.lastGrade === 0)
            .sort((a,b) => a.index - b.index)
            .slice(0, DAILY_LIMIT);

        activeQueue = [...newCards, ...againCards];
    }

    buildDailyQueue();

    let currentCard = null;
    let isFlipped = false;

    function saveData() {
        localStorage.setItem('knn_anki_clean_day_db', JSON.stringify(ankiData));
    }

    function getMasteredCards() {
        return Object.values(ankiData).filter(c => c.lastGrade >= 2).length;
    }

    function renderNextCard() {
        document.getElementById('due-count').textContent = activeQueue.length;
        document.getElementById('mastered-count').textContent = getMasteredCards();

        if (activeQueue.length === 0) {
            document.getElementById('card-icon').style.display = 'none';
            document.getElementById('word-text').textContent = "🎉 Bugünün Paketi Bitti!";
            document.getElementById('speak-btn').style.display = 'none';
            document.getElementById('meaning-text').textContent = "Günün tüm kelimelerini tamamladın.";
            document.getElementById('meaning-text').style.display = 'block';
            document.getElementById('example-text').style.display = 'none';
            document.getElementById('translation-text').style.display = 'none';
            document.getElementById('hint-text').textContent = "Yeni 50 kelime + dünden kalanlar için 'Yeni Güne Geç' butonunu kullanabilirsin.";
            document.getElementById('main-show-btn').style.display = 'none';
            document.getElementById('anki-controls').style.display = 'none';
            return;
        }

        currentCard = activeQueue[0];
        isFlipped = false;

        document.getElementById('card-icon').textContent = currentCard.icon || '💡';
        document.getElementById('card-icon').style.display = 'none'; // Görsel kapatıldı
        document.getElementById('word-text').textContent = currentCard.word;
        document.getElementById('speak-btn').style.display = 'flex';
        document.getElementById('meaning-text').textContent = currentCard.meaning;
        document.getElementById('example-text').textContent = currentCard.example ? `Örnek: ${currentCard.example}` : '';
        document.getElementById('translation-text').textContent = currentCard.translation ? `Türkçesi: ${currentCard.translation}` : '';
        
        document.getElementById('meaning-text').style.display = 'none';
        document.getElementById('example-text').style.display = 'none';
        document.getElementById('translation-text').style.display = 'none';
        document.getElementById('hint-text').textContent = "Cevabı Görmek İçin Tıkla (Space)";
        
        document.getElementById('main-show-btn').style.display = 'block';
        document.getElementById('anki-controls').style.display = 'none';
    }

    function speakWord(event) {
        if (event) event.stopPropagation();
        if (!currentCard || !currentCard.word) return;

        if ('speechSynthesis' in window) {
            window.speechSynthesis.cancel();
            const utterance = new SpeechSynthesisUtterance(currentCard.word);
            utterance.lang = 'en-US';
            utterance.rate = 0.85;
            window.speechSynthesis.speak(utterance);
        }
    }

    function showAnswer() {
        if (!currentCard || isFlipped) return;
        isFlipped = true;

        document.getElementById('card-icon').style.display = 'block';
        document.getElementById('meaning-text').style.display = 'block';
        if (currentCard.example) document.getElementById('example-text').style.display = 'block';
        if (currentCard.translation) document.getElementById('translation-text').style.display = 'block';
        document.getElementById('hint-text').textContent = "";

        document.getElementById('main-show-btn').style.display = 'none';
        document.getElementById('anki-controls').style.display = 'flex';
    }

    function processAnki(grade) {
        if (!currentCard || !isFlipped) return;

        let card = ankiData[currentCard.id];
        card.lastGrade = grade;

        saveData();

        const poppedCard = activeQueue.shift();

        // Çalışırken 1 (Yeniden) dersen o anki sıranın EN SONUNA ekle
        if (grade === 1) {
            activeQueue.push(poppedCard);
        }

        renderNextCard();
    }

    function deleteCardDirectly(cardId) {
        if (confirm("Bu kelimeyi listeden kalıcı olarak silmek istediğine emin misin?")) {
            delete ankiData[cardId];
            saveData();
            buildDailyQueue();
            renderNextCard();
            updateFilterCounts();
            filterList('all', document.querySelector('.filter-chip.active'));
        }
    }

    // YENİ GÜNE GEÇİŞ SİSTEMİ
    function advanceToNextDay() {
        const password = prompt("Yeni güne geçmek için şifreyi girin:");
        if (password === "1213") {
            // Bugün çözülen "2 (Zor)", "3 (İyi)" veya "4 (Kolay)" kelimeler temizlendi.
            // Sadece "1 (Yeniden)" olanlar bir sonraki güne devretti.
            buildDailyQueue();
            renderNextCard();
            alert("Başarılı! Yeni gün kuruldu: Yeni 50 Kelime + Dünden Kalan '1' İşaretliler yüklendi.");
        } else if (password !== null) {
            alert("Hatalı şifre! İşlem iptal edildi.");
        }
    }

    function updateFilterCounts() {
        const counts = { all: 0, 0: 0, 1: 0, 2: 0, 3: 0, 4: 0 };
        Object.values(ankiData).forEach(item => {
            const g = item.lastGrade || 0;
            counts.all++;
            counts[g]++;
        });

        document.getElementById('filter-all').textContent = `Tümü (${counts.all})`;
        document.getElementById('filter-1').textContent = `🔴 Yeniden (${counts[1]})`;
        document.getElementById('filter-2').textContent = `🟠 Zor (${counts[2]})`;
        document.getElementById('filter-3').textContent = `🔵 İyi (${counts[3]})`;
        document.getElementById('filter-4').textContent = `🟢 Kolay (${counts[4]})`;
        document.getElementById('filter-0').textContent = `⚪ Bakılmadı (${counts[0]})`;
    }

    function openListModal() {
        document.getElementById('list-modal').style.display = 'flex';
        updateFilterCounts();
        filterList('all', document.getElementById('filter-all'));
    }

    function closeListModal() {
        document.getElementById('list-modal').style.display = 'none';
    }

    function filterList(filter, btn) {
        document.querySelectorAll('.filter-chip').forEach(b => b.classList.remove('active'));
        if (btn) btn.classList.add('active');

        const container = document.getElementById('modal-word-container');
        container.innerHTML = '';

        const labelMap = { 0: 'Bakılmadı', 1: 'Yeniden', 2: 'Zor', 3: 'İyi', 4: 'Kolay' };

        Object.values(ankiData).sort((a,b) => a.index - b.index).forEach(item => {
            const grade = item.lastGrade || 0;
            if (filter === 'all' || grade === filter) {
                const div = document.createElement('div');
                div.className = 'word-item';
                div.innerHTML = `
                    <div class="word-item-info">
                        <div class="word-item-title">${item.index + 1}. ${item.word}</div>
                        <div class="word-item-sub">${item.meaning}</div>
                    </div>
                    <div class="word-item-actions">
                        <span class="badge badge-${grade}">${labelMap[grade]}</span>
                        <button class="delete-btn" onclick="deleteCardDirectly('${item.id}')">Sil</button>
                    </div>
                `;
                container.appendChild(div);
            }
        });
    }

    document.addEventListener('keydown', function(e) {
        if (e.code === 'Space' || e.code === 'Enter') {
            e.preventDefault();
            if (!isFlipped) showAnswer();
        } else if (isFlipped) {
            if (e.key === '1') processAnki(1);
            if (e.key === '2') processAnki(2);
            if (e.key === '3') processAnki(3);
            if (e.key === '4') processAnki(4);
        }
    });

    function resetSystem() {
        if (confirm("Tüm Anki verileri silinecek ve sıfırlanacak. Emin misin?")) {
            localStorage.removeItem('knn_anki_clean_day_db');
            location.reload();
        }
    }

    renderNextCard();
</script>

</body>
</html>
